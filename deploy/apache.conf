<VirtualHost *:80>
    DocumentRoot /var/www/greenline/web
    SetEnvIf X-Forwarded-Proto "^https$" HTTPS=on

    <Directory /var/www/greenline/web>
        Options -Indexes
        AllowOverride None
        Require all granted
        DirectoryIndex index.php

        RewriteEngine On
        RewriteCond %{REQUEST_FILENAME} !-f
        RewriteCond %{REQUEST_FILENAME} !-d
        RewriteRule ^ index.php [L]
    </Directory>

    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    <LocationMatch "(?i)^/(?!index\.php$).*\.php(?:/|$)">
        Require all denied
    </LocationMatch>
</VirtualHost>
